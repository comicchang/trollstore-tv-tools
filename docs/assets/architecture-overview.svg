<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="TrollStore TV Tools Workflow Architecture">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="18" fill="url(#bg2)" stroke="#1f2937" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" fill="#f9fafb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="700">TrollStore TV Tools — BYOIPA Packaging, Signing &amp; Verification Pipelines</text>
  <text x="40" y="74" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5">Pure MIT Host Toolkit · Zero Proprietary IPAs / DRM Code · Read-Only Verification Defaults · CI Verified</text>
  <rect x="40" y="88" width="1120" height="2" fill="url(#accent2)" opacity="0.6"/>

  <!-- Left Column: Inputs (x=40..280, w=240, inner=56..264 w=208) -->
  <rect x="40" y="114" width="240" height="316" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <rect x="40" y="114" width="240" height="36" rx="14" fill="#1e293b"/>
  <text x="56" y="137" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="12" font-weight="700">USER-SUPPLIED INPUTS</text>

  <rect x="56" y="166" width="208" height="68" rx="10" fill="#111827" stroke="#334155"/>
  <text x="70" y="189" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Open-Source .deb</text>
  <text x="70" y="210" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">e.g. Kodi tvOS (GPL-2.0+)</text>

  <rect x="56" y="248" width="208" height="78" rx="10" fill="#111827" stroke="#334155"/>
  <text x="70" y="271" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Local Decrypted IPA</text>
  <text x="70" y="292" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">BYOIPA (cryptid == 0)</text>
  <text x="70" y="310" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">Supplied locally by user</text>

  <rect x="56" y="340" width="208" height="72" rx="10" fill="#111827" stroke="#334155"/>
  <text x="70" y="363" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Clean-Room Probe Src</text>
  <text x="70" y="384" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">src/probe (Demo+ProbeKit)</text>


  <line x1="280" y1="196" x2="310" y2="196" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="280" y1="274" x2="310" y2="274" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="280" y1="388" x2="310" y2="388" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>


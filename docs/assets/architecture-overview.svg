  <text x="392" y="346" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="12">Recursive Mach-O + nested .appex per-bundle ent + symlink &amp; cryptid guards</text>

  <rect x="378" y="370" width="409" height="44" rx="10" fill="#111827" stroke="#334155"/>
  <text x="392" y="397" fill="#34d399" font-family="ui-monospace,monospace" font-size="12.5" font-weight="700">build-probe.sh · install-probe.sh · stage2-verify.sh</text>


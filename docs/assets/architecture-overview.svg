  <text x="882" y="300" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Verified CDHash &amp; T8ALTGMVXN</text>
  <text x="882" y="317" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">For lab / offline signing</text>

  <rect x="868" y="346" width="274" height="68" rx="10" fill="#111827" stroke="#334155"/>
  <text x="882" y="369" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Read-Only Reboot Audit</text>
  <text x="882" y="390" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Trustcache · CDHash · Crash delta</text>


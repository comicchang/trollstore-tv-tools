  <rect x="882" y="114" width="278" height="316" rx="14" fill="#0f172a" stroke="#065f46"/>
  <rect x="882" y="114" width="278" height="36" rx="14" fill="#064e3b"/>
  <text x="898" y="137" fill="#34d399" font-family="ui-monospace,monospace" font-size="12" font-weight="700">OUTPUTS &amp; TARGET</text>

  <rect x="898" y="166" width="246" height="74" rx="10" fill="#111827" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="912" y="189" fill="#34d399" font-family="-apple-system,sans-serif" font-size="13.5" font-weight="700">Clean tvOS .ipa</text>
  <text x="912" y="210" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11">Install via on-device</text>
  <text x="912" y="227" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11">comicchang/trollstore-tv</text>

  <rect x="898" y="256" width="246" height="74" rx="10" fill="#111827" stroke="#334155"/>
  <text x="912" y="279" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="13.5" font-weight="600">Host-Signed CoreTrust</text>
  <text x="912" y="300" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">Verified CDHash &amp; T8ALTGMVXN</text>
  <text x="912" y="317" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">For lab / offline signing</text>

  <rect x="898" y="346" width="246" height="68" rx="10" fill="#111827" stroke="#334155"/>
  <text x="912" y="369" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="13.5" font-weight="600">Read-Only Reboot Audit</text>
  <text x="912" y="390" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.5">Trustcache · CDHash · Crash</text>

  <!-- Arrows Mid -> Right -->
  <line x1="846" y1="205" x2="876" y2="205" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="846" y1="322" x2="876" y2="300" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="846" y1="392" x2="876" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Bottom Compliance Bar (x=40..1160) -->
  <rect x="40" y="452" width="1120" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="60" y="476" fill="#34d399" font-family="ui-monospace,monospace" font-size="12" font-weight="700">COMPLIANCE &amp; SAFETY</text>
  <text x="230" y="476" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="12">Zero bundled IPAs, artwork, keys, or DRM code · External links only (ipatool, fairplay-decrypt, TizenTube, SponsorBlock, DeArrow)</text>
  <text x="60" y="497" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10.8">Offline CI gate: make check (sh -n · shellcheck · plutil · synthetic deb/ipa/appex tests · privacy &amp; binary allowlist · links)</text>

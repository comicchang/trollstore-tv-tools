  <text x="346" y="274" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">cobalt-patcher + RGBA8 icon invert (default ON; --no-invert-icon) + sandbox</text>

  <rect x="332" y="306" width="498" height="52" rx="10" fill="#111827" stroke="#334155"/>
  <text x="346" y="328" fill="#f3f4f6" font-family="ui-monospace,monospace" font-size="12" font-weight="700">fetch-fastpathsign.sh + sign-coretrust.sh</text>
  <text x="346" y="346" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11.5">Recursive Mach-O + nested .appex per-bundle ent + symlink &amp; cryptid checks</text>

  <rect x="332" y="370" width="498" height="44" rx="10" fill="#111827" stroke="#334155"/>
  <text x="346" y="397" fill="#34d399" font-family="ui-monospace,monospace" font-size="12" font-weight="700">build-probe.sh · install-probe.sh · stage2-verify.sh</text>


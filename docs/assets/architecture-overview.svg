  <text x="40" y="74" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">Pure MIT Host Toolkit · Zero Proprietary IPAs / DRM Code · Read-Only Verification Defaults · CI Verified</text>
  <rect x="40" y="88" width="1120" height="2" fill="url(#accent2)" opacity="0.6"/>


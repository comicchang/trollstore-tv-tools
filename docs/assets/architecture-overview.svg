  <rect x="316" y="114" width="530" height="316" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <rect x="316" y="114" width="530" height="36" rx="14" fill="#1e293b"/>
  <text x="332" y="137" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="12" font-weight="700">HOST-SIDE SCRIPTS (MACOS / LINUX)</text>

  <rect x="332" y="166" width="498" height="54" rx="10" fill="#111827" stroke="#334155"/>
  <text x="346" y="188" fill="#f3f4f6" font-family="ui-monospace,monospace" font-size="12.5" font-weight="700">deb2ipa.sh</text>
  <text x="346" y="207" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11.5">Extract /Applications/*.app · strip .jbroot · zero-compress --store</text>

  <rect x="332" y="232" width="498" height="62" rx="10" fill="#111827" stroke="#334155"/>

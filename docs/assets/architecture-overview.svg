  <line x1="805" y1="205" x2="844" y2="205" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="805" y1="322" x2="844" y2="300" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="805" y1="392" x2="844" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>


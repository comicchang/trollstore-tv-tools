  <text x="60" y="477" fill="#34d399" font-family="ui-monospace,monospace" font-size="12.5" font-weight="700">COMPLIANCE &amp; SAFETY</text>
  <text x="235" y="477" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="13">Zero bundled IPAs, artwork, keys, or DRM-decryption code · External links only (ipatool, fairplay-decrypt, TizenTube, SponsorBlock, DeArrow)</text>
